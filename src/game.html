<title>정치인키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 선거 벽보·투표용지 감성의 단일 컬럼 게임 화면. 정당 색이 강조색이 되고, 기표 도장이 시그니처. */
:root{
  --paper:#EEF0EF; --card:#FFFFFF; --card2:#F6F7F6; --ink:#15191E; --muted:#5D646C; --line:#D6DADB;
  --stamp:#C2321F; --jj:#1D59D3; --sm:#D2253A; --ind:#737A83;
  --good:#1E8A4C; --bad:#C2321F; --warn:#B7791F;
  --p:var(--ind);
  --f-disp:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111416; --card:#1A1E21; --card2:#22272B; --ink:#ECEEEF; --muted:#9BA2A9; --line:#2E3438;
  --stamp:#E65A44; --jj:#5E8CFF; --sm:#FF5C6E; --ind:#A2A8B0; --good:#4CC27F; --bad:#FF6B57; --warn:#E3A84A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111416; --card:#1A1E21; --card2:#22272B; --ink:#ECEEEF; --muted:#9BA2A9; --line:#2E3438;
  --stamp:#E65A44; --jj:#5E8CFF; --sm:#FF5C6E; --ind:#A2A8B0; --good:#4CC27F; --bad:#FF6B57; --warn:#E3A84A; color-scheme:dark}
body[data-party="jj"]{--p:var(--jj)} body[data-party="sm"]{--p:var(--sm)} body[data-party="ind"]{--p:var(--ind)}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.party{background:var(--p);border-color:var(--p);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* ---------- start ---------- */
.poster{position:relative;overflow:hidden;padding:26px 20px 22px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.poster h1{font-size:clamp(44px,12vw,76px);line-height:.95}
.poster .sub{margin-top:10px;color:var(--muted);max-width:30em}
.stamp{position:absolute;right:14px;top:14px;width:92px;height:92px;transform:rotate(-12deg);opacity:.9}
.stamp circle{fill:none;stroke:var(--stamp);stroke-width:7}
.stamp text{fill:var(--stamp);font-family:serif;font-size:58px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink)}
.ballot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ballot button,.chooser button{border:1.5px solid var(--line);background:var(--card2);border-radius:8px;padding:12px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.ballot button .no{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.ballot button b{font-family:var(--f-disp);font-weight:400;font-size:19px}
.ballot button[aria-pressed="true"],.chooser button[aria-pressed="true"]{border-color:var(--c,var(--ink));box-shadow:inset 0 0 0 2px var(--c,var(--ink))}
.ballot button span:last-child{font-size:12px;color:var(--muted)}
.chooser{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chooser button small{color:var(--muted);font-size:12px}
.chooser button b{font-size:14px}
.hof{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hof button{display:flex;justify-content:space-between;gap:10px;border:0;border-bottom:1px dashed var(--line);background:none;padding:6px 2px;text-align:left;font-size:13px;border-radius:4px}
.hof button:hover{background:var(--card2)}
.hof button>span:last-child{text-align:right;color:var(--muted)}
.viewer.hofv{z-index:45}.viewer.hofv img{max-height:70vh}
.hofv[hidden]{display:none}

/* ---------- game header ---------- */
.hdr{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-top:6px solid var(--p)}
.giho{width:58px;height:58px;border-radius:50%;border:3px solid var(--p);box-shadow:0 0 0 2px #fff inset,0 2px 0 rgba(0,0,0,.12);background:radial-gradient(circle at 35% 30%,#fffdf6,#e9e2d2);overflow:hidden;flex:none;position:relative}
.giho canvas{position:absolute;left:50%;top:2px;width:56px;height:56px;transform:translateX(-50%);image-rendering:pixelated}
.hdr h2{font-size:24px}
.hdr .meta{font-size:13px;color:var(--muted)}
.yr{text-align:right}
.yr .num{font-size:22px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--card2);white-space:nowrap}
.chip.p{border-color:var(--p);color:var(--p);font-weight:700}
.chip.red{border-color:var(--bad);color:var(--bad);font-weight:700}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.stat{display:grid;grid-template-columns:4.6em 1fr 3.2em;gap:8px;align-items:center;font-size:13px}
.bar{height:7px;background:var(--card2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ink);transition:width .4s}
.stat.hl .bar i{background:var(--p)}
.stat .num{text-align:right}
.money{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-size:13px}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.route{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card2)}
.route.on{border-color:var(--p)}
.route h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.pops{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:12px}
.popbar{flex:1;height:10px;display:flex;border-radius:5px;overflow:hidden;background:var(--card2)}
.popbar i:first-child{background:var(--jj)} .popbar i:last-child{background:var(--sm);margin-left:auto}

.trialbar{border:1.5px solid var(--bad);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card)}
.steps{display:flex;gap:4px}
.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--bad)}

/* ---------- stage ---------- */
.stage{min-height:200px}
.stage h3{font-size:22px}
.ap{display:flex;gap:5px}
.ap i{width:16px;height:16px;border-radius:50%;border:2px solid var(--p)}
.ap i.full{background:var(--p)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.act{border:1.5px solid var(--line);background:var(--card2);border-radius:8px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.act:hover:not(:disabled){border-color:var(--p)}
.act b{font-size:14px}
.act small{font-size:12px;color:var(--muted);line-height:1.35}
.act .cost{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.dark{border-style:dashed;border-color:var(--bad)}
.act.dark .cost{color:var(--bad)}
.news{border-left:4px solid var(--p);padding-left:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--stamp);padding:2px 7px;border-radius:3px;margin-bottom:6px}
.tag.blue{background:var(--jj)} .tag.gray{background:var(--ind)} .tag.ink{background:var(--ink);color:var(--card)}
.body{margin:8px 0 14px;max-width:62ch}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{border:1.5px solid var(--line);background:var(--card2);border-radius:8px;padding:11px 13px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.choice:hover:not(:disabled){border-color:var(--p)}
.choice small{color:var(--muted);font-size:12px;white-space:nowrap}
.choice:disabled{opacity:.4;cursor:not-allowed}
.result{background:var(--card2);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.d{font-size:12px;font-family:var(--f-num);padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.d.up{color:var(--good);border-color:var(--good)} .d.dn{color:var(--bad);border-color:var(--bad)}
.count{margin:14px 0}
.count .track{height:26px;border-radius:6px;background:var(--card2);border:1px solid var(--line);position:relative;overflow:hidden}
.count .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--p);transition:width 1.6s cubic-bezier(.2,.7,.2,1)}
.count .half{position:absolute;left:50%;top:-4px;bottom:-4px;border-left:2px dashed var(--ink)}
.count .pct{font-family:var(--f-num);font-size:30px;font-weight:600}
.win-stamp{width:120px;height:120px;margin:4px auto;display:block;transform:rotate(-10deg)}
.win-stamp circle{fill:none;stroke:var(--stamp);stroke-width:7}
.win-stamp text{fill:var(--stamp);font-family:serif;font-size:76px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.win-stamp{animation:thunk .35s ease-out}}
@keyframes thunk{from{transform:rotate(-10deg) scale(1.6);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
.law{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.law small{white-space:nowrap}
.ending h2{font-size:clamp(30px,8vw,46px);line-height:1.05}
.ending dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.ending dt{color:var(--muted)}
.ending dd{margin:0}

/* ---------- log ---------- */
.px{display:block;width:100%;max-width:560px;height:auto;aspect-ratio:2/1;image-rendering:crisp-edges;image-rendering:pixelated;border:2px solid var(--ink);border-radius:6px;margin:0 0 12px;background:#9fd0ee}
.distbox{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.region{display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.region .label{margin-right:4px}
.req{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.up-b{color:var(--good);font-size:10px} .dn-b{color:var(--bad);font-size:10px}
.choice.dark{border-style:dashed;border-color:var(--bad)} .choice.dark small{color:var(--bad)}
.choice>small{text-align:right;white-space:normal;max-width:48%;line-height:1.35;flex-shrink:0}
.choice>span{min-width:0}
.choice span small{white-space:normal}
.choice.law>small{max-width:none;white-space:nowrap}
.lawhead{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:11px;color:var(--muted);padding:0 13px 4px;font-weight:700}
.odds{background:var(--card2);border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 10px;display:flex;flex-direction:column;gap:3px}
.odds b{font-family:var(--f-num)}
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;padding:0 2px}
.prog .dots{display:flex;gap:4px;flex-wrap:wrap} .prog .dots i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.prog .dots i.on{background:var(--p)} .prog .dots i.cur{background:var(--p);opacity:.45}
.reqs{margin-top:10px;font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.reqs summary{cursor:pointer;font-weight:700;color:var(--muted)}
.reqs ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.reqs li span.ok,.reqs li span.no{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:3px;margin-right:6px;color:#fff}
.reqs li span.ok{background:var(--good)} .reqs li span.no{background:var(--muted)}
.tag.gray{background:var(--ind)}
.share img{display:block;width:100%;max-width:420px;border-radius:8px;border:1px solid var(--line);background:var(--card2);aspect-ratio:720/1000}
.ending .px{margin-top:8px;max-width:420px}
.looks{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:start}
#lookc{width:120px;height:135px;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--ink);border-radius:8px;background:#eef3f6}
.lookopts{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;flex-direction:column;gap:4px}
.lbtns{display:flex;flex-wrap:wrap;gap:5px}
.lbtns button{border:1.5px solid var(--line);background:var(--card2);border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.lbtns button[aria-pressed="true"]{border-color:var(--p);box-shadow:inset 0 0 0 1.5px var(--p);font-weight:700}
.lbtns i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--line)}
@media (max-width:420px){.looks{grid-template-columns:96px minmax(0,1fr)}#lookc{width:96px;height:108px}}
.sheetbg{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheethead{display:flex;justify-content:space-between;align-items:center}
.sheetprev{display:flex;gap:12px;align-items:center;margin:10px 0 14px;font-size:13px}
.sheetprev img{width:56px;border-radius:6px;border:1px solid var(--line)}
.apps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer}
.app .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;font-family:var(--f-body)}
.app .nm{font-size:11.5px;white-space:nowrap}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer img{max-width:100%;max-height:75vh;border-radius:8px}
.viewer p{color:#eceeef;margin:0;font-size:14px;text-align:center}
.sheetbg[hidden],.viewer[hidden]{display:none}
@media (max-width:380px){.apps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.log h3{font-size:17px;margin-bottom:8px}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:260px;overflow:auto;font-size:13px}
.log li{display:grid;grid-template-columns:3.4em 1fr;gap:8px}
.log li .num{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}

@media (max-width:520px){
  .stats{grid-template-columns:1fr}
  .ballot{grid-template-columns:1fr}
  .hdr{grid-template-columns:auto 1fr}
  .yr{grid-column:1/-1;text-align:left;display:flex;gap:10px;align-items:baseline}
  .routes{grid-template-columns:1fr}
}
</style>

<div class="wrap" id="app"></div>

function chg(o){
  for(const k in o){
    let v=o[k];
    if(k==='money'){if(v>0)v*=CTX.money}
    else if(CTX.mode==='act'&&v>0)v*=0.85*CTX.m;
    else if(CTX.mode==='ev')v*=(CTX.tempt&&k==='integrity')?1:1.75;
    if(v>0&&k!=='money'&&k!=='mental')v*=Math.max(.3,1-S.s[k]/150);
    if(k==='fame'&&v>0&&CTX.mode!=='none'&&S.office!=='pres'&&isBattle())v*=1.35;
    v=Math.round(v);if(!v)continue;
    if(k==='party'&&!member())continue;
    const before=S.s[k];
    if(k==='money')S.s.money=Math.max(0,before+v);else S.s[k]=clamp(before+v,0,100);
    const d=S.s[k]-before;if(d)D.push([k,d]);
  }
}
function addLog(t){S.log.unshift([S.year,t]);if(S.log.length>120)S.log.pop()}

function elecKinds(y){const PB=(typeof S!=='undefined'&&S&&S.presBase)||2030;const e=[];if(y>2026&&(y-2026)%4===0)e.push('local');if(y>=2028&&(y-2028)%4===0)e.push('general');if(y>=PB&&(y-PB)%5===0)e.push('pres');return e}

function nextElecYear(kind,y){for(let t=y+1;t<y+12;t++)if(elecKinds(t).includes(kind))return t}

/* ============ 연말 큐 ============ */
const wrapMode=()=>!!S.exPres||(S.age>=65&&!inOffice());
function buildQueue(){
  if(wrapMode()){const q=[];if(S.trial&&S.trial.started<S.year)q.push({type:'trial'});else if(!S.trial&&S.cases.length&&R()<(S.exPres?.7:.4))q.push({type:'detect'});S.qTotal=Math.max(1,q.length);return q}
  const q=[];
  const pool=EV.filter(e=>!e.core&&(!e.c||e.c())&&!(S.seen[e.id]&&S.year-S.seen[e.id]<4));
  const n=Math.min(pool.length,2);
  const elecSoon=elecKinds(S.year).length>0||elecKinds(S.year+1).length>0;
  const wt=e=>e.tempt?(1+(broke()?2.5:0)+(elecSoon?1:0)):(e.w||1);
  const chosen=[];let guard=0;while(chosen.length<n&&guard++<200){const tot=pool.reduce((a,e)=>a+(chosen.includes(e)?0:wt(e)),0);let r0=R()*tot;
    for(const e of pool){if(chosen.includes(e))continue;r0-=wt(e);if(r0<=0){chosen.push(e);break}}}
  S.fv=elecKinds(S.year+1).length?3:(R()<.5?0:R()<.5?1:2);
  q.push({type:'ev',id:(s().mental<35||S.year%2)?'c_work':'c_promo'});
  chosen.forEach((e,i)=>{q.push({type:'ev',id:e.id});if(i===0&&R()<.6)q.push({type:'fig'})});
  if(!isPres()&&S.age<64&&elecKinds(S.year+1).includes('pres')&&(presPaths().council||presPaths().admin))q.splice(1,0,{type:'ev',id:'p_camp'});
  if(!isPres())q.push({type:'ev',id:'c_fund'});
  if(isNat()&&member()&&(S.held.nat||0)+(S.held.natp||0)>=2&&!S.titles.chair&&(S.year-2029)%2===0)q.push({type:'chair'});
  if(isNat()&&member()&&!S.titles.leader&&s().party>=55&&(S.year-2027)%2===0)q.push({type:'leader'});
  if(S.trial&&S.trial.started<S.year)q.push({type:'trial'});
  else if(!S.trial&&S.cases.length){
    S.cases=S.cases.filter(c=>S.year-c.y<7);
    const p=S.cases.reduce((a,c)=>a+.025*c.sev,0)+(100-s().integrity)/1500+s().fame/1200;
    if(R()<p)q.push({type:'detect'});
  }
  if(isPres()&&S.impDone!==S.termEnd&&((s().support<25&&myMaj()===false)||s().support<15||(S.trial&&S.trial.sev>=3))&&R()<.65)q.splice(q.length-1,0,{type:'impeach'});
  if(elecKinds(S.year).length&&!isPres()&&S.age<65)q.push({type:'elec'});
  S.qTotal=q.length;
  return q;
}

const PHEX={jj:'#2f6be0',sm:'#e0384c',ind:'#8a9099'};
const K='#1b1b22';let PF=0,PXS='',PXT=null;
function hx(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))}
function toHex(a){return'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function shade(c,f){return toHex(hx(c).map(v=>f<=1?v*f:v+(255-v)*(f-1)))}
function mix(a,b,t){const A=hx(a),B=hx(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))}
function grad(r,y0,y1,c0,c1,n=6){if(PXC&&PXC.hi){const c=PXC.c,N=Math.round((y1-y0)*2);for(let i=0;i<N;i++){c.fillStyle=mix(c0,c1,i/Math.max(1,N-1));c.fillRect(0,y0+i/2,256,.5)}return}
  const h=(y1-y0)/n;for(let i=0;i<n;i++){const ya=Math.round(y0+i*h),yb=Math.round(y0+(i+1)*h);r(0,ya,256,yb-ya,mix(c0,c1,i/(n-1)));
  if(i<n-1){const nc=mix(c0,c1,(i+1)/(n-1));for(let x=i%2;x<256;x+=2)r(x,yb-1,1,1,nc)}}}
function disc(r,cx,cy,rad,col,half){if(PXC&&PXC.hi){const c=PXC.c;c.fillStyle=col;for(let dy=-rad;dy<=(half?0:rad);dy+=.5){const w=Math.round(Math.sqrt(Math.max(0,rad*rad-dy*dy))*2)/2;if(w>0)c.fillRect(Math.round(cx*2)/2-w,Math.round((cy+dy)*2)/2,w*2,.5)}return}
  for(let dy=-rad;dy<=(half?0:rad);dy++){const w=Math.round(Math.sqrt(rad*rad-dy*dy));r(cx-w,cy+dy,w*2,1,col)}}
function cloud(r,x,y,s=1){x+=PF*2;const W='#ffffff';if(PXC&&PXC.hi){const G='#d4e2ee';disc(r,x,y+1.5,Math.round(6*s),G);disc(r,x+Math.round(9*s),y-Math.round(3*s)+1.5,Math.round(8*s),G);disc(r,x+Math.round(19*s),y+1.5,Math.round(6*s),G);r(x-Math.round(5*s),y+2,Math.round(30*s),Math.round(5*s),G)}disc(r,x,y,Math.round(6*s),W);disc(r,x+Math.round(9*s),y-Math.round(3*s),Math.round(8*s),W);disc(r,x+Math.round(19*s),y,Math.round(6*s),W);
  r(x-Math.round(5*s),y+1,Math.round(30*s),Math.round(5*s),W);r(x-Math.round(4*s),y+Math.round(5*s),Math.round(28*s),1,'#d7e6f1')}
function tree(r,x,y){r(x+6,y+14,4,16,'#6b4a2e');r(x+8,y+14,2,16,'#4f3520');disc(r,x+8,y+8,10,'#2f7a3e');disc(r,x+6,y+6,8,'#3f8a4c');disc(r,x+5,y+4,5,'#56a861');r(x+3,y+1,3,2,'#7cc488');
  if(PXC&&PXC.hi){const c=PXC.c;disc(r,x+11,y+12,5,'#2a6b37');disc(r,x+3,y+11,4,'#357f42');for(let i=0;i<26;i++){const a=i*2.4,rr=(i%9)+.5,px=x+8+Math.cos(a)*rr,py=y+7+Math.sin(a)*rr*.85;c.fillStyle=py<y+6?'#8fd39a':i%3?'#4a9a56':'#24603a';c.fillRect(Math.round(px*2)/2,Math.round(py*2)/2,.5,.5)}
    c.fillStyle='#8a6a4a';for(let i=0;i<5;i++)c.fillRect(x+6.5,y+16+i*3,.5,1.5);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(x+2,y+29.5,13,1)}}
function lamp(r,x,y,on){r(x,y,2,100-y,'#4a4f57');r(x+2,y,8,2,'#4a4f57');r(x+7,y+2,6,3,on?'#ffe48a':'#d9dde2');r(x+7,y+5,6,1,'#2f333a');r(x-1,98,4,2,'#3a3e45')}
function skyline(r,rnd,base,night){let x=-4;while(x<256){const w=18+(rnd()*20|0),h=24+(rnd()*44|0),y=base-h;
  const pal=night?['#283055','#2f3862','#232a4a','#353f6c']:['#c3c8d1','#aeb6c3','#d6d0c3','#9fa9b8','#cbbfae'];const col=pal[rnd()*pal.length|0];
  r(x,y,w,h,col);r(x,y,2,h,shade(col,1.12));r(x+w-3,y,3,h,shade(col,.84));r(x,y,w,2,shade(col,.7));

function renderQueueItem(st){

    if(S.cur.type==='trial'&&S.trial)S.trial.stage++;}

  if(S.res){st.innerHTML=`<div class="result">${S.res.html}${S.res.d||''}</div><button class="btn primary" id="nx">다음 →</button>`;
    document.getElementById('nx').onclick=()=>{S.cur=null;S.res=null;save();render();scrollStage()};return}
  if(it.type==='ev')renderEvent(st,EV.find(e=>e.id===it.id));
  else if(it.type==='fig')renderFig(st);
  else if(it.type==='chair')renderChair(st);

function pAcq(t,L){const b=pBase(t,L);if(t.stage===1)return b;if(t.stage===2)return clamp(b*.85+(t.prev?APPEAL2:0),.03,.95);return clamp(b*.35+(t.prev?APPEAL3:0),.03,.97)}

function reqMet(o){const H=S.held,has=k=>(H[k]||0)>0||(k==='nat'&&(H.natp||0)>0);switch(o){case 'basic':case 'metro':return true;case 'natp':return member()&&s().party>=50&&!((H.natp||0)>0);

      <dt>최종 소속</dt><dd>${PARTIES[S.party].n}</dd>
      <dt>최고 직위</dt><dd>${esc(S.bestName||offName(S.best))}</dd>
      <dt>거친 자리</dt><dd>${held||'—'}</dd>
      <dt>선거 전적</dt><dd class="num">${S.stats.wins}승 ${S.stats.losses}패</dd>
      <dt>재판</dt><dd>${S.stats.trials?S.stats.trials+'건':'없음'}</dd>${S.rival?`<dt>라이벌</dt><dd>${esc(S.rival.name)} 상대 ${S.rival.l}승 ${S.rival.w}패</dd>`:''}
      <dt>남은 자금</dt><dd class="num">${won(s().money)}</dd>
    </dl>
    <div class="row" style="margin-top:18px"><button class="btn party" id="again">새 정치인 키우기</button></div>
  </section>
  <section class="card share"><h3 style="font-size:20px">결과 카드</h3>
    <p class="muted" style="margin:4px 0 12px;font-size:13px">공유하기를 누르면 보낼 곳을 고를 수 있어요.</p>
    <img id="shareImg" alt="정치 인생 결과 카드">
    <div class="row" style="margin-top:12px"><button class="btn party" id="cpy">공유하기</button><span id="cpyMsg" class="muted" style="font-size:13px"></span></div>
    <textarea id="cpyTxt" readonly hidden></textarea>
  </section>${logHTML()}
  ${sheetHTML()}`;
  document.getElementById('again').onclick=()=>{S=null;UI.cfg=null;render()};
  paint(ENDPX[S.end]||'street|me|');
  const txt=shareText();const cb=document.getElementById('cpy'),msg=document.getElementById('cpyMsg'),ta=document.getElementById('cpyTxt');ta.value=txt;
  cb.onclick=()=>openSheet(txt);
  makeCard();
}

/* ============ 시작 ============ */
function initDl(){try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{UI.dl=d},()=>{})}catch(e){}}
function fixup(){if(S&&S.v===4&&!S.rival&&S.phase!=='ending'){S.rival=mkRival()}}
function boot(data){
  if(data&&data.S&&data.S.v===4)S=data.S;else{const sv=store.get('pol-save');S=null;UI.resume=sv}
  render();setTimeout(initDl,0);
}
window.__polRefresh=(force)=>{if(force||!S||S.phase==='start'){S=null;UI.resume=store.get('pol-save');render()}};window.__polBusy=()=>!!(S&&S.phase!=='start'&&S.phase!=='ending');
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
