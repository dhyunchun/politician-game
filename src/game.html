<title>정치인키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 선거 벽보·투표용지 감성의 단일 컬럼 게임 화면. 정당 색이 강조색이 되고, 기표 도장이 시그니처. */
:root{
  --paper:#EEF0EF; --card:#FFFFFF; --card2:#F6F7F6; --ink:#15191E; --muted:#5D646C; --line:#D6DADB;
  --stamp:#C2321F; --jj:#1D59D3; --sm:#D2253A; --ind:#737A83;
  --good:#1E8A4C; --bad:#C2321F; --warn:#B7791F;
  --p:var(--ind);
  --f-disp:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111416; --card:#1A1E21; --card2:#22272B; --ink:#ECEEEF; --muted:#9BA2A9; --line:#2E3438;
  --stamp:#E65A44; --jj:#5E8CFF; --sm:#FF5C6E; --ind:#A2A8B0; --good:#4CC27F; --bad:#FF6B57; --warn:#E3A84A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111416; --card:#1A1E21; --card2:#22272B; --ink:#ECEEEF; --muted:#9BA2A9; --line:#2E3438;
  --stamp:#E65A44; --jj:#5E8CFF; --sm:#FF5C6E; --ind:#A2A8B0; --good:#4CC27F; --bad:#FF6B57; --warn:#E3A84A; color-scheme:dark}
body[data-party="jj"]{--p:var(--jj)} body[data-party="sm"]{--p:var(--sm)} body[data-party="ind"]{--p:var(--ind)} body[data-party="np"]{--p:#D9731A}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.party{background:var(--p);border-color:var(--p);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* ---------- start ---------- */
.poster{position:relative;overflow:hidden;padding:26px 20px 22px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.poster h1{font-size:clamp(44px,12vw,76px);line-height:.95}
.poster .sub{margin-top:10px;color:var(--muted);max-width:30em}
.stamp{position:absolute;right:14px;top:14px;width:92px;height:92px;transform:rotate(-12deg);opacity:.9}
.stamp circle{fill:none;stroke:var(--stamp);stroke-width:7}
.stamp text{fill:var(--stamp);font-family:serif;font-size:58px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink)}
.ballot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ballot button,.chooser button{border:1.5px solid var(--line);background:var(--card2);border-radius:8px;padding:12px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.ballot button .no{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.ballot button b{font-family:var(--f-disp);font-weight:400;font-size:19px}
.ballot button[aria-pressed="true"],.chooser button[aria-pressed="true"]{border-color:var(--c,var(--ink));box-shadow:inset 0 0 0 2px var(--c,var(--ink))}
.ballot button span:last-child{font-size:12px;color:var(--muted)}
.chooser{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chooser button small{color:var(--muted);font-size:12px}
.chooser button b{font-size:14px}
.hof{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hof button{display:flex;justify-content:space-between;gap:10px;border:0;border-bottom:1px dashed var(--line);background:none;padding:6px 2px;text-align:left;font-size:13px;border-radius:4px}
.hof button:hover{background:var(--card2)}
.hof button>span:last-child{text-align:right;color:var(--muted)}
.suspense{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:14px;padding:18px 12px;border-radius:12px;background:#1b1410;color:#f3e6d0;text-align:center}
.suspense canvas{width:192px;height:144px;image-rendering:pixelated}
.suspense b{font-family:var(--f-disp);font-weight:400;font-size:20px;letter-spacing:.02em}
.suspense span{font-size:13px;opacity:.75}
.viewer.hofv{z-index:45}.viewer.hofv img{max-height:70vh}
.hofv[hidden]{display:none}

/* ---------- game header ---------- */
.hdr{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-top:6px solid var(--p)}
.giho{width:58px;height:58px;border-radius:50%;border:3px solid var(--p);box-shadow:0 0 0 2px #fff inset,0 2px 0 rgba(0,0,0,.12);background:radial-gradient(circle at 35% 30%,#fffdf6,#e9e2d2);overflow:hidden;flex:none;position:relative}
.giho canvas{position:absolute;left:50%;top:2px;width:56px;height:56px;transform:translateX(-50%);image-rendering:pixelated}
.hdr h2{font-size:24px}
.hdr .meta{font-size:13px;color:var(--muted)}
.yr{text-align:right}
.yr .num{font-size:22px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--card2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.p{border-color:var(--p);color:var(--p);font-weight:700}
.chip.red{border-color:var(--bad);color:var(--bad);font-weight:700}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.stat{display:grid;grid-template-columns:4.6em 1fr 3.2em;gap:8px;align-items:center;font-size:13px}
.bar{height:7px;background:var(--card2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ink);transition:width .4s}
.stat.hl .bar i{background:var(--p)}
.stat .num{text-align:right}
.money{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-size:13px}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.route{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card2)}
.route.on{border-color:var(--p)}
.route h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.pops{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:12px}
.popbar{flex:1;height:10px;display:flex;border-radius:5px;overflow:hidden;background:var(--card2)}
.popbar i:first-child{background:var(--jj)} .popbar i:last-child{background:var(--sm);margin-left:auto}

.trialbar{border:1.5px solid var(--bad);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card)}
.steps{display:flex;gap:4px}
.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--bad)}

/* ---------- stage ---------- */
.stage{min-height:200px}
.stage h3{font-size:22px}
.ap{display:flex;gap:5px}
.ap i{width:16px;height:16px;border-radius:50%;border:2px solid var(--p)}
.ap i.full{background:var(--p)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.act{border:1.5px solid var(--line);background:var(--card2);border-radius:8px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.act:hover:not(:disabled){border-color:var(--p)}
.act b{font-size:14px}
.act small{font-size:12px;color:var(--muted);line-height:1.35}
.act .cost{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.dark{border-style:dashed;border-color:var(--bad)}
.act.dark .cost{color:var(--bad)}
.news{border-left:4px solid var(--p);padding-left:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--stamp);padding:2px 7px;border-radius:3px;margin-bottom:6px}
.tag.blue{background:var(--jj)} .tag.gray{background:var(--ind)} .tag.ink{background:var(--ink);color:var(--card)}
.body{margin:8px 0 14px;max-width:62ch}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{border:1.5px solid var(--line);background:var(--card2);border-radius:8px;padding:11px 13px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.choice:hover:not(:disabled){border-color:var(--p)}
.choice small{color:var(--muted);font-size:12px;white-space:nowrap}
.choice:disabled{opacity:.4;cursor:not-allowed}
.result{background:var(--card2);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.d{font-size:12px;font-family:var(--f-num);padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.d.up{color:var(--good);border-color:var(--good)} .d.dn{color:var(--bad);border-color:var(--bad)}
.bcast{display:flex;align-items:center;gap:10px;background:#101722;color:#fff;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.bcast b{font-family:var(--f-disp);font-weight:400;font-size:17px;flex:1}
.bcast .live{display:inline-flex;align-items:center;gap:5px;font:700 11px/1 var(--f-num);background:#d12b2b;padding:4px 7px;border-radius:4px}
.bcast .live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
.bcast .num{font-family:var(--f-num);font-size:13px;color:#ffd257}
@keyframes blink{50%{opacity:.2}}
.exitpoll{border:2px solid var(--ink);border-radius:8px;padding:10px 12px;margin:10px 0;transition:opacity .4s}
.exitpoll .label{font-size:12px;font-weight:700;color:var(--muted)}
.exitpoll div{font-size:17px;margin-top:2px}.exitpoll .num{font-family:var(--f-num);font-weight:600}
.exitpoll small{color:var(--muted)}
.exitpoll.dim{opacity:.45}
.callout{min-height:1.6em;margin-top:10px;font-size:15px;text-align:center}
.callout .ok{color:var(--good)}.callout .bad{color:var(--bad)}.callout .hot{color:var(--warn);font-weight:700}
@media (prefers-reduced-motion: reduce){.bcast .live i{animation:none}}
.achtoast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:70;display:flex;gap:10px;align-items:center;background:#1d2a44;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px;line-height:1.3;transition:opacity .5s,transform .5s}
.achtoast span{font-size:26px}.achtoast.out{opacity:0;transform:translate(-50%,-10px)}
.dexov{position:fixed;inset:0;z-index:65;background:rgba(10,12,16,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.dexov[hidden]{display:none}
.dexbox{background:var(--card);border-radius:14px;max-width:720px;width:100%;padding:18px}
.dexbox h4{font-family:var(--f-disp);font-weight:400;font-size:17px;margin:16px 0 8px}
.dexhead{display:flex;gap:10px;align-items:baseline}.dexhead b{font-family:var(--f-disp);font-weight:400;font-size:22px}.dexhead .muted{flex:1;font-size:13px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.dex{border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:13px;color:var(--muted);background:var(--card2)}
.dex b{display:block;color:var(--muted)}.dex small{font-size:11px}
.ctitle{margin:6px 0 2px;display:flex;flex-direction:column;gap:2px}.ctitle b{color:var(--warn);font-size:17px}.ctitle span{color:var(--muted);font-size:14px}
.polls{display:flex;flex-direction:column;gap:10px;margin-top:10px}.pollrow{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card2)}
.pollhd,.pollft{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}.pollhd b{font-size:15px}.pollft .good{color:var(--good);font-weight:600}.pollft .bad{color:var(--bad);font-weight:600}
.pollbar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:6px 0;font-size:12px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.pollbar i{display:flex;align-items:center;font-style:normal;white-space:nowrap;overflow:hidden}.pollbar .me{background:var(--p);padding-left:6px}.pollbar .und{background:var(--line)}.pollbar .op{background:#8a8f98;justify-content:flex-end;padding-right:6px}
.evdex details{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--card2)}
.evdex summary{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-size:14px}.evdex summary>span:first-child{flex:1;font-weight:600}
.evbar{display:block;width:60px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.evbar i{display:block;height:100%;background:var(--warn)}
.evdex ul{margin:0;padding:0 10px 10px 26px;font-size:13px;color:var(--muted);columns:2;column-gap:16px}.evdex li{break-inside:avoid;margin:2px 0}.evrest{margin:0;padding:0 10px 10px;font-size:12px;color:var(--muted)}.evdex li.on{color:var(--ink)}
@media (max-width:420px){.evdex ul{columns:1}}
.dex.on{border-style:solid;border-color:var(--warn);background:var(--card);color:var(--ink)}.dex.on b{color:var(--ink)}
.npin{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--card2);color:inherit;margin-top:4px}
.perks{margin:12px 0}.perks .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.perks .opt{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px;text-align:left}
.perks .opt[aria-pressed="true"]{border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.newach{margin:12px 0;padding:10px 12px;border-radius:10px;background:rgba(183,121,31,.12);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.newach span{background:var(--card);border-radius:999px;padding:2px 10px;font-size:13px}
.budget{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.brow small{display:block;color:var(--muted);font-size:12px}
.bctl{display:flex;align-items:center;gap:6px}.bctl .btn{padding:4px 12px}.cells{font-family:var(--f-num);letter-spacing:1px;color:var(--p);min-width:6.5em;text-align:center}
.spark{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:auto}.spark small{font-size:11px;color:var(--muted)}
.pfmap{margin-top:8px}.pfmap .label{font-size:12px;font-weight:700;color:var(--muted)}
.pfbar{display:flex;height:18px;border-radius:5px;overflow:hidden;margin:4px 0 2px;font-size:11px;line-height:18px;color:#fff;font-weight:700}
.pfbar i{font-style:normal;padding-left:6px;white-space:nowrap;overflow:hidden}.pfbar .m{background:var(--p)}.pfbar .n{background:var(--muted)}.pfbar .o{background:var(--warn)}
.pfmap small{font-size:12px}
.sndb{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));opacity:.85;z-index:40;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.15);cursor:pointer}
.statpanel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.statpanel>summary::-webkit-details-marker{display:none}
.sumstrip{display:flex;gap:10px;flex-wrap:wrap}.sumstrip span{display:flex;flex-direction:column;align-items:center;min-width:34px}.sumstrip small{font-size:10px;color:var(--muted)}.sumstrip b{font-size:14px}
.sumhint{font-size:12px;color:var(--muted);white-space:nowrap}.sumhint::after{content:' ▾'}.statpanel[open] .sumhint::after{content:' ▴'}
.statpanel[open]>summary{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
details.log>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px}details.log>summary::-webkit-details-marker{display:none}
details.log>summary h3::after{content:' ▾';font-size:13px;color:var(--muted)}details.log[open]>summary h3::after{content:' ▴'}
details.log>summary .muted{font-size:12px}
.yearcard{text-align:center;padding:6px 0 10px}.bigyear{font-size:56px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.notes{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}.notes li{background:var(--card2);border-radius:8px;padding:8px 10px;font-size:14px}
.dgroup{margin:8px 0}.dgroup .label{font-size:12px;color:var(--muted);font-weight:700}
#stage{animation:cardin .28s ease-out}
@keyframes cardin{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#stage{animation:none}}
@media (max-width:640px){
  .choice{min-height:54px}
  #nx,#ny,#bok,#agok,#lok,#npok{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:100%;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.2);min-height:50px;font-size:16px}
  .sumstrip{gap:6px}
}
.rvchron .rvc{border-top:1px dashed var(--line);padding:10px 0}.rvchron .rvc:first-of-type{border-top:none}
.rvchron p{margin:4px 0;font-size:14px}.rvp{list-style:none;padding:0;margin:4px 0 0;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}.rvp .num{margin-right:4px;font-weight:600}
.chip.more{cursor:pointer;background:var(--card);font-weight:700}.chips.more{margin-top:4px}
.famrow{font-size:13px;margin:10px 0 4px}
.stepper{list-style:none;display:flex;gap:6px;padding:0;margin:0}.stepper li{flex:1}
.stepper button{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:6px 4px;font-size:13px;display:flex;gap:6px;align-items:center;justify-content:center}
.stepper .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:12px}
.stepper button[aria-current="step"]{border-color:var(--p);color:var(--ink);font-weight:700}.stepper button[aria-current="step"] .num{background:var(--p);color:#fff}
.stepper button.done .num{background:var(--good);color:#fff}
.stepgrp{display:flex;flex-direction:column;gap:16px}.stepgrp[hidden]{display:none}
.stepnav{justify-content:space-between}.stepnav .btn.primary{margin-left:auto}
.confirm{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}.confirm dt{color:var(--muted)}.confirm dd{margin:0;font-weight:600}
.poster.compact .sub,.poster.compact .stamp{display:none}
@media (max-width:640px){
  .ballot{grid-template-columns:repeat(3,1fr)!important}.ballot button{padding:8px 6px}.ballot button>span:last-child{display:none}.ballot button b{font-size:14px}
  #rg{grid-template-columns:repeat(4,1fr)}#rg button{padding:8px 4px;text-align:center;align-items:center}#rg button small{font-size:10px}
  #ds{grid-template-columns:repeat(2,1fr)}#ds button{padding:8px 6px}
  #bgc{grid-template-columns:repeat(2,1fr)}
}.poster.compact h1{font-size:34px}
.count{margin:14px 0}

/* ============ 연말 큐 ============ */
const wrapMode=()=>!!S.exPres||(S.age>=65&&!inOffice());
function buildQueue(){
  if(wrapMode()){const q=[];if(S.trial&&S.trial.started<S.year)q.push({type:'trial'});else if(!S.trial&&S.cases.length&&R()<(S.exPres?.7:.4))q.push({type:'detect'});S.qTotal=Math.max(1,q.length);return q}
  if(S.togul&&!inOffice()){const q=[{type:'ev',id:'tg_day'}];
    const pool=EV.filter(e=>!e.core&&(e.tg||e.tag==='칩거'||e.tag==='하산')&&(!e.c||e.c())&&!(S.seen[e.id]&&S.year-S.seen[e.id]<4));
    const n=Math.min(pool.length,2),chosen=[];let g=0;while(chosen.length<n&&g++<200){const tot=pool.reduce((a,e)=>a+(chosen.includes(e)?0:(e.w||1)),0);let r0=R()*tot;for(const e of pool){if(chosen.includes(e))continue;r0-=(e.w||1);if(r0<=0){chosen.push(e);break}}}
    chosen.forEach(e=>q.push({type:'ev',id:e.id}));
    {const yr=EV.find(e=>e.id==='y_return');if(yr&&yr.c()&&!q.some(x=>x.id==='y_return'))q.push({type:'ev',id:'y_return'})}
    if(S.trial&&S.trial.started<S.year)q.push({type:'trial'});
    else if(!S.trial&&S.cases.length){S.cases=S.cases.filter(c=>S.year-c.y<7);const p=S.cases.reduce((a,c)=>a+.025*c.sev,0)+(100-s().integrity)/1500;if(R()<p)q.push({type:'detect'})}
    S.qTotal=q.length;return q}
  if(S.minister&&(S.ruling!==S.minister.party||isPres()))endMin('정권이 바뀌어 장관직에서 물러났다.');
  if(S.pm&&(S.ruling!==S.pm.party||isPres()))endPm('정권이 바뀌어 국무총리직에서 물러났다.');
  if(S.pm){const q=[{type:'ev',id:'pm_work'}];const ok=e=>!e.core&&e.pm&&(!e.c||e.c())&&!(S.seen[e.id]&&S.year-S.seen[e.id]<3);
    const L=EV.filter(ok);for(let i=0;i<2&&L.length;i++){const e=L.splice(Math.floor(R()*L.length),1)[0];q.push({type:'ev',id:e.id})}
    if(R()<.3)q.push({type:'fig'});if(S.office!=='none')q.push({type:'ev',id:'c_fund'});
    if(S.year-S.pm.from>=2+(S.pm.ext||0))q.push({type:'ev',id:'pm_end'});
    if(S.age<64&&elecKinds(S.year+1).includes('pres')&&(presPaths().council||presPaths().admin))q.splice(1,0,{type:'ev',id:'p_camp'});
    if(S.trial&&S.trial.started<S.year)q.push({type:'trial'});
    else if(!S.trial&&S.cases.length){S.cases=S.cases.filter(c=>S.year-c.y<7);const p=S.cases.reduce((a,c)=>a+.033*c.sev,0)+(100-s().integrity)/1200+s().fame/1200;if(R()<p)q.push({type:'detect'})}
    addPoll(q);if(elecKinds(S.year).length&&S.age<65)q.push({type:'elec'});
    S.qTotal=q.length;return q}
  if(S.minister){const q=[{type:'ev',id:'mn_work'}],d=S.minister.d;
    const ok=e=>!e.core&&e.mn&&(!e.c||e.c())&&!(S.seen[e.id]&&S.year-S.seen[e.id]<3);
    const pickW=L=>{const tot=L.reduce((a,e)=>a+(e.w||1),0);let r0=R()*tot;for(const e of L){r0-=(e.w||1);if(r0<=0)return e}return L[0]};
    const own=EV.filter(e=>ok(e)&&e.md===d),gen=EV.filter(e=>ok(e)&&!e.md);
    if(own.length)q.push({type:'ev',id:pickW(own).id});if(gen.length)q.push({type:'ev',id:pickW(gen).id});
    if(R()<.3)q.push({type:'fig'});
    if(S.office!=='none')q.push({type:'ev',id:'c_fund'});
    if(S.year-S.minister.from>=2+(S.minister.ext||0))q.push({type:'ev',id:'mn_reshuffle'});
    if(pmOfferOk()&&R()<.5){S.pmOfferY=S.year;q.splice(1,0,{type:'ev',id:'pm_offer'})}
    if(S.age<64&&elecKinds(S.year+1).includes('pres')&&(presPaths().council||presPaths().admin))q.splice(1,0,{type:'ev',id:'p_camp'});
    if(S.trial&&S.trial.started<S.year)q.push({type:'trial'});
    else if(!S.trial&&S.cases.length){S.cases=S.cases.filter(c=>S.year-c.y<7);const p=S.cases.reduce((a,c)=>a+.033*c.sev,0)+(100-s().integrity)/1200+s().fame/1200;if(R()<p)q.push({type:'detect'})}
    addPoll(q);if(elecKinds(S.year).length&&S.age<65)q.push({type:'elec'});
    S.qTotal=q.length;return q}
  const q=[];
  const BIG=big();const pool=EV.filter(e=>!e.core&&!e.tg&&!e.mn&&!e.pm&&(!e.c||e.c())&&!(S.seen[e.id]&&S.year-S.seen[e.id]<4)&&!(BIG&&JUNIOR.has(e.id)));
  const n=Math.min(pool.length,2);
  const elecSoon=elecKinds(S.year).length>0||elecKinds(S.year+1).length>0;
  // 직책 전용 이벤트(단체장·의원 등)는 범용 풍자에 묻히지 않게 2배 가중
  const SPEC=/isAdmin|isNat|isCouncil|isLocalCouncil|isPres/;
  const wt=e=>(e.tempt?(1+(broke()?2.5:0)+(elecSoon?1:0)):(e.w||1))*(e.c&&SPEC.test(String(e.c))?1.8:1);
  const chosen=[];let guard=0;while(chosen.length<n&&guard++<200){const tot=pool.reduce((a,e)=>a+(chosen.includes(e)?0:wt(e)),0);let r0=R()*tot;
    for(const e of pool){if(chosen.includes(e))continue;r0-=wt(e);if(r0<=0){chosen.push(e);break}}}
  S.fv=elecKinds(S.year+1).length?3:(R()<.5?0:R()<.5?1:2);
  q.push({type:'ev',id:(s().mental<35||S.year%2)?'c_work':'c_promo'});
  chosen.forEach((e,i)=>{q.push({type:'ev',id:e.id});if(i===0&&R()<.35)q.push({type:'fig'})});
  if(!isPres()&&S.age<64&&elecKinds(S.year+1).includes('pres')&&(presPaths().council||presPaths().admin))q.splice(1,0,{type:'ev',id:'p_camp'});
  if(S.rvEv&&rvOk()){q.splice(1,0,{type:'ev',id:S.rvEv});S.rvEv=null}
  if(isPres())presQueue(q);
  if(pmOfferOk()&&R()<.5){S.pmOfferY=S.year;q.splice(1,0,{type:'ev',id:'pm_offer'})}
  else if(minOfferOk()&&R()<.55){S.minOfferY=S.year;q.splice(1,0,{type:'ev',id:'mn_offer'})}
  if(opp()&&isNat()&&(S.held.nat||0)+(S.held.natp||0)>=2&&s().party>=50&&!(S.titles.whip>=S.year)&&!S.titles.leader&&S.year%2===1)q.splice(1,0,{type:'ev',id:'op_whip'});
  if(opp()&&isNat()&&R()<.5&&!q.some(x=>x.id&&/^op_/.test(x.id))){const L=EV.filter(e=>e.op&&(!e.c||e.c())&&!(S.seen[e.id]&&S.year-S.seen[e.id]<4));if(L.length)q.splice(q.length-1,0,{type:'ev',id:pick(L).id})}
  if(S.titles.whip&&S.titles.whip>=S.year&&opp()&&isNat())q.splice(1,0,{type:'ev',id:'op_whipwork'});
  if(S.crisis&&S.crisis.fresh){S.crisis.fresh=0;q.splice(1,0,{type:'ev',id:'n_'+S.crisis.k})}
  if(isPres()&&S.trialHold&&!S.haltShown){S.haltShown=1;q.splice(1,0,{type:'ev',id:'p_halt'})}
  if(!isPres())q.push({type:'ev',id:'c_fund'});
  if(isNat()&&member()&&(S.held.nat||0)+(S.held.natp||0)>=2&&!S.titles.chair&&(S.year-2029)%2===0)q.push({type:'chair'});
  if(isNat()&&twoParty()&&!S.titles.leader&&s().party>=55&&(S.year-2027)%2===0)q.push({type:'leader'});
  if(S.trial&&S.trial.started<S.year)q.push({type:'trial'});
  else if(!S.trial&&S.cases.length&&!isPres()){
    S.cases=S.cases.filter(c=>S.year-c.y<7);
    const p=S.cases.reduce((a,c)=>a+.033*c.sev,0)+(100-s().integrity)/1200+s().fame/1200;
    if(R()<p)q.push({type:'detect'});
  }
  if(isPres()&&S.impDone!==S.termEnd&&((s().support<25&&myMaj()===false)||s().support<15||(S.trial&&S.trial.sev>=3))&&R()<.65)q.splice(q.length-1,0,{type:'impeach'});
  addPoll(q);if(elecKinds(S.year).length&&!isPres()&&S.age<65)q.push({type:'elec'});
  S.qTotal=q.length;
  return q;
}

/* ============ 픽셀 아트 (256×128) ============ */
const PHEX={jj:'#2f6be0',sm:'#e0384c',ind:'#8a9099',np:'#e07b1a'};
const K='#1b1b22';let PF=0,PXS='',PXT=null;
function hx(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))}
function toHex(a){return'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function shade(c,f){return toHex(hx(c).map(v=>f<=1?v*f:v+(255-v)*(f-1)))}
function mix(a,b,t){const A=hx(a),B=hx(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))}

// 배율 K(단위당 픽셀)로 래스터화한다. 바깥 외곽선·레이어 경계선은 픽셀 단위로 자동.
function HDR(K,flip){
  const U0x=-26,U0y=-36,UW=88,UH=112,GW=Math.ceil(UW*K),GH=Math.ceil(UH*K);
  const col=new Array(GW*GH).fill(null),lay=new Int16Array(GW*GH),nol=new Uint8Array(GW*GH);let L=0,NL=0;
  const LX=-.62,LY=-.78;
  const each=(x0,y0,x1,y1,fn)=>{let i0,i1;if(!flip){i0=Math.floor((x0-U0x)*K)-1;i1=Math.ceil((x1-U0x)*K)+1}else{i0=Math.floor((36-x1-U0x)*K)-1;i1=Math.ceil((36-x0-U0x)*K)+1}
    const j0=Math.max(0,Math.floor((y0-U0y)*K)-1),j1=Math.min(GH-1,Math.ceil((y1-U0y)*K)+1);
    for(let j=j0;j<=j1;j++)for(let i=Math.max(0,i0);i<=Math.min(GW-1,i1);i++){let ux=(i+.5)/K+U0x;if(flip)ux=36-ux;const uy=(j+.5)/K+U0y;const c=fn(ux,uy);if(c){const q=j*GW+i;col[q]=c;lay[q]=L;nol[q]=NL}}};
  const band=(dt,o)=>{if(o.flat)return 1;const f=dt>.62?1.24:dt>.22?1.08:dt>-.28?1:dt>-.66?.8:.64;return f*(o.f||1)};
  const lit=(nx,ny)=>(flip?-nx:nx)*LX+ny*LY;
  const TT=[[.1,1.3],[.26,1.1],[.62,1],[.84,.8],[1,.64]];
  const tone=(fr,o)=>{if(o.flat)return o.f||1;if(flip)fr=1-fr;for(const[l,m]of(o.tones||TT))if(fr<=l)return m*(o.f||1);return 1};
  const api={K,
    part(){L++;NL=0},feat(){L++;NL=1},
    cap(ax,ay,bx,by,ra,rb,c,o={}){if(o.flat){ra=Math.max(ra,.55/K);rb=Math.max(rb,.55/K)}const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||.001,ux=dx/len,uy=dy/len,R=Math.max(ra,rb);
      each(Math.min(ax,bx)-R,Math.min(ay,by)-R,Math.max(ax,bx)+R,Math.max(ay,by)+R,(x,y)=>{const vx=x-ax,vy=y-ay;let al=vx*ux+vy*uy;al=Math.max(0,Math.min(len,al));const qx=vx-ux*al,qy=vy-uy*al,d=Math.hypot(qx,qy),r=ra+(rb-ra)*al/len;if(d>r)return null;
        return shade(c,band(d<.05?0:lit(qx/d,qy/d)*Math.min(1,d/r*1.3),o))})},
    ell(cx,cy,rx,ry,c,o={}){rx=Math.max(rx,.55/K);ry=Math.max(ry,.55/K);each(cx-rx,cy-ry,cx+rx,cy+ry,(x,y)=>{const nx=(x-cx)/rx,ny=(y-cy)/ry,d=nx*nx+ny*ny;if(d>1)return null;if(o.clip&&!o.clip(x,y))return null;return shade(c,band(lit(nx,ny)*Math.min(1,Math.sqrt(d)*1.2),o))})},
    poly(pts,c,o={}){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
      each(x0,y0,x1,y1,(x,y)=>{let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins}
        if(!ins)return null;if(o.clip&&!o.clip(x,y))return null;return shade(c,tone((x-x0)/(x1-x0||1),o))})},
    rect(x,y,w,h,c,o={}){each(x,y,x+w,y+h,(px,py)=>px>=x&&px<x+w&&py>=y&&py<y+h?shade(c,o.f||1):null)},
    line(ax,ay,bx,by,w,c){api.cap(ax,ay,bx,by,w/2,w/2,c,{flat:1})},
    // 몸통: 목(n)→엉덩이(h) 축, 왼쪽 폭 wl(t)·오른쪽 폭 wr(t). at(t,s): s>0 이 화면 오른쪽(로컬)
    trunk(nx,ny,hx,hy,wl,wr,c,o={}){const dx=hx-nx,dy=hy-ny,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
      each(Math.min(nx,hx)-16,Math.min(ny,hy)-2,Math.max(nx,hx)+16,Math.max(ny,hy)+2,(x,y)=>{const vx=x-nx,vy=y-ny,al=vx*ux+vy*uy;if(al<0||al>len)return null;const t=al/len,sr=vx*uy-vy*ux,a=wl(t),b=wr(t);if(sr<-a||sr>b)return null;
        return shade(c,tone((sr+a)/(a+b||1),o))});return(t,s)=>[nx+dx*t+uy*s,ny+dy*t-ux*s]},
    flush(ctx,X,Y){const out=col.slice();
      for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;
        if(!col[i]){let nb=null;if(x>0&&col[i-1])nb=col[i-1];else if(x<GW-1&&col[i+1])nb=col[i+1];else if(y>0&&col[i-GW])nb=col[i-GW];else if(y<GH-1&&col[i+GW])nb=col[i+GW];if(nb)out[i]=shade(nb,.28)}
        else if(!nol[i]){const l=lay[i];const chk=j=>col[j]&&!nol[j]&&lay[j]>l;if((x>0&&chk(i-1))||(x<GW-1&&chk(i+1))||(y>0&&chk(i-GW))||(y<GH-1&&chk(i+GW)))out[i]=shade(col[i],.5)}}
      const ox=Math.round(X+U0x*K),oy=Math.round(Y+U0y*K);
      for(let y=0;y<GH;y++){let x=0;while(x<GW){const cl=out[y*GW+x];if(!cl){x++;continue}let n=1;while(x+n<GW&&out[y*GW+x+n]===cl)n++;ctx.fillStyle=cl;ctx.fillRect(ox+x,oy+y,n,1);x+=n}}}};
  return api}

const lerpA=arr=>t=>{const k=Math.max(0,Math.min(1,t))*(arr.length-1),i=Math.min(arr.length-2,Math.floor(k)),f=k-i;return arr[i]+(arr[i+1]-arr[i])*f};

let ZZ=1;// 배경 좌표(1024 기준) → 실제 캔버스 배율. 512 격자면 0.5
function PX2(ctx){const Z=ZZ;
  const rawR=(x,y,w,h,c)=>{if(w<=0||h<=0)return;ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
  const sc=(x,y,w,h)=>{const X=Math.round(x*Z),Y=Math.round(y*Z);return[X,Y,Math.max(1,Math.round((x+w)*Z)-X),Math.max(1,Math.round((y+h)*Z)-Y)]};
  const R=(x,y,w,h,c)=>{if(w<=0||h<=0)return;rawR(...sc(x,y,w,h),c)};
  const poly=(pts,c)=>{pts=pts.map(([x,y])=>[x*Z,y*Z]);let y0=1e9,y1=-1e9;for(const p of pts){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}ctx.fillStyle=c;
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){const yc=y+.5,xs=[];for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>yc)!==(yj>yc))xs.push(xi+(yc-yi)/(yj-yi)*(xj-xi))}
      xs.sort((a,b)=>a-b);for(let k=0;k+1<xs.length;k+=2){const a=Math.round(xs[k]),b=Math.round(xs[k+1]);if(b>a)ctx.fillRect(a,y,b-a,1)}}};
  const ell=(cx,cy,rx,ry,c)=>{cx*=Z;cy*=Z;rx=Math.max(.6,rx*Z);ry=Math.max(.6,ry*Z);ctx.fillStyle=c;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++){const t=(y+.5-cy)/ry;if(Math.abs(t)>1)continue;const w=rx*Math.sqrt(1-t*t);const a=Math.round(cx-w),b=Math.round(cx+w);if(b>a)ctx.fillRect(a,y,b-a,1)}};
  // 테두리 있는 상자: 테두리 1픽셀, 윗면 밝게, 아래 어둡게
  const box=(x,y,w,h,c,o={})=>{const[X,Y,W,H]=sc(x,y,w,h);const e=o.e||shade(c,.32);rawR(X,Y,W,H,e);rawR(X+1,Y+1,W-2,H-2,c);if(!o.flat&&H>4){const t=Math.max(1,Math.round(H*.06)),b=Math.max(1,Math.round(H*.08));rawR(X+1,Y+1,W-2,t,shade(c,1.18));rawR(X+1,Y+H-1-b,W-2,b,shade(c,.82))}};
  return{R,poly,ell,box}}

const FACE2={'+':'smile','!':'angry','~':'sad','?':'shock'};
function parseWho(who){return(who?who.split(','):[]).filter(Boolean).map(w=>{const m=w.match(/^([a-z0-9]+)([\^+!~?]*)$/i)||[0,w,''];return{k:m[1],wave:m[2].includes('^'),face:[...m[2]].map(ch=>FACE2[ch]).find(Boolean)||''}})}
function stageScene(bg,who,props){
  const all=parseWho(who),crowd=all.some(p=>p.k==='crowd'),P=all.filter(p=>p.k!=='crowd'),n=P.length,has=k=>props.includes(k),meI=P.findIndex(p=>p.k==='me');
  const out=[];if(!n)return out;
  const BEN=SCN[bg]&&SCN[bg].bench,judges=BEN?P.filter(p=>p.k==='judge'):[],rest=BEN?P.filter(p=>p.k!=='judge'):P;
  // 자리: 연단·탁자·법대 같은 소품/배경이 있으면 그에 맞춘다
  let slots;const m=rest.length;
  if(has('podium')){slots=[[256,288],[150,294],[362,294],[78,290],[440,290]]}
  else if(has('desk')){slots=m===1?[[256,282]]:m===2?[[200,282],[312,282]]:[[256,282],[140,280],[372,280],[60,278]]}
  else if(m===1)slots=[[226,298]];
  else if(m===2)slots=[[200,300],[318,294]];
  else if(m===3)slots=[[256,302],[134,290],[380,292]];
  else slots=[[236,302],[110,288],[352,296],[452,286],[40,284]];
  // 주인공이 첫 자리(가장 앞), 나머지는 순서대로
  const order=rest.slice().sort((a,b)=>(b.k==='me')-(a.k==='me'));
  const others=order.filter(p=>p.k!=='me'),me=order.find(p=>p.k==='me');
  const mood=me?me.face:'',rival=others.find(p=>p.k==='riv'),anyone=others.length+judges.length;
  // 두 사람이 웃는 얼굴로 만나면 악수, 봉투·돈 소품이면 건네기
  const partner=others.find(p=>['cit','cit2','old','biz','fjj','fsm','aide'].includes(p.k));
  const shakeMode=me&&partner&&m===2&&(mood==='smile'||me.wave)&&!has('podium')&&!has('desk')&&partner.face!=='angry';
  const giveMode=me&&others.some(p=>p.k==='biz')&&(has('env')||has('cash')||has('book')||has('bag'));
  order.forEach((p,i)=>{let[x,fy]=slots[Math.min(i,slots.length-1)];let pose='idleQ',face=p.face;
    if(p.k==='me'){
      if(has('podium'))pose=p.wave?'fistUp':mood==='sad'?'bowF':'talkF';
      else if(has('umbrella'))pose='umb';
      else if(has('phone'))pose='phone';
      else if(has('glass'))pose='toast';
      else if(has('bag'))pose='holdBag';
      else if(has('env')&&!giveMode)pose='paper';
      else if(giveMode)pose=mood==='smile'?'shake':'think';
      else if(shakeMode)pose='shake';
      else if(p.wave)pose=mood==='smile'||crowd?'fistUp':'wave';
      else if(mood==='angry')pose=rival||others.length?'point':judges.length?'cross':'hips';
      else if(mood==='sad')pose=anyone?'clasp':'despair';
      else if(mood==='shock')pose='shock';
      else if(has('desk'))pose='talkF';
      else pose=others.length?'talkQ':judges.length?'clasp':'talkF';
    }else{const k=p.k;
      if(giveMode&&k==='biz'){pose='give';if(!face)face='smile'}
      else if(shakeMode&&p===partner)pose='shake';
      else if(k==='riv')pose=face==='angry'?'point':face==='smile'?'cross':face==='sad'?'clasp':'idleQ';
      else if(k==='rep')pose=has('cam')||bg==='press'?'memo':'memo';
      else if(k==='aide')pose=p.wave?'clap':mood==='sad'?'clasp':'paper';
      else if(k==='doc')pose='paper';
      else if(k==='judge')pose='judge';
      else if(k==='biz')pose=face==='angry'?'cross':'talkQ';
      else if(k==='fjj'||k==='fsm')pose='talkQ';
      else{pose=face==='smile'?(mood==='smile'||me&&me.wave?'cheerQ':'clap'):face==='angry'?'point':face==='sad'?'clasp':face==='shock'?'shock':p.wave?'wave':(i%2?'talkQ':'idleQ')}
    }
    if(has('desk')&&p.k!=='me'&&!['give','shake'].includes(pose))pose=pose==='paper'?'paper':'idleQ';
    out.push({k:p.k,pose,x,fy,face,me:p.k==='me'})});
  // 악수·건네기: 손이 닿는 거리로 붙인다(배율 1.7에서 중심 사이 약 75픽셀)
  if(shakeMode||giveMode){const a=out.find(o=>o.me),b=out.find(o=>!o.me&&(o.pose==='shake'||o.pose==='give'));if(a&&b){const K=kz(Math.min(a.fy,b.fy)),gap=(b.pose==='give'?57:43.5)*K;if(b.x>a.x)b.x=a.x+gap;else b.x=a.x-gap;b.fy=a.fy-2}}
  // 판사: 법대 뒤 단상(배경의 법대에 맞춰 위로 들어 올림)
  judges.forEach((p,i)=>{const nJ=judges.length,x=nJ===1?256:256+(i-(nJ-1)/2)*92;out.push({k:'judge',pose:'judge',x,fy:200,lift:38,clipY:BEN,face:p.face,me:false})});
  // 방향: 주인공은 상대(라이벌 우선)를 보고, 나머지는 주인공을 본다
  const meO=out.find(o=>o.me);
  out.forEach(o=>{if(o.k==='judge'){o.flip=false;return}
    const tgt=o.me?(out.find(q=>q.k==='riv')||out.filter(q=>!q.me&&q.k!=='judge').sort((u,v)=>Math.abs(u.x-o.x)-Math.abs(v.x-o.x))[0]):meO;
    o.flip=tgt?tgt.x<o.x:o.x>256});
  return out}

function gavelSuspense(st,done){

  const K='#2a1a10',W1='#8a5a32',W2='#b37a46',W3='#d9a066',G='#e2b04a';

    c.restore();
    if(f===2){r(6,38,5,1,G);r(4,34,4,1,G);r(45,38,5,1,G);r(47,34,4,1,G);r(27,25,1,4,G);r(20,27,1,3,G);r(35,27,1,3,G)}};

    <div class="sheetprev"><img id="sheetImg" alt="결과 카드"><span class="muted" id="sheetGrade"></span></div>
    <div class="apps" id="apps"></div><p class="muted" id="shMsg" style="font-size:13px;min-height:1.4em;margin:8px 0 0"></p>
  </div></div>
  <div class="viewer" id="viewer" hidden><img id="viewImg" alt="결과 카드 크게 보기"><p>이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요.</p><button class="btn" id="vx">닫기</button></div>`}
const GAME_URL=window.__GAME_URL||'https://claude.ai/artifact/NyESfQPSDvNWpyfy5hborW';
function openSheet(txt){
  const sh=document.getElementById('sheet'),apps=document.getElementById('apps'),m=document.getElementById('shMsg'),src=(document.getElementById('hofImg')&&!document.getElementById('hofv').hidden?document.getElementById('hofImg'):document.getElementById('shareImg')).src;
  document.getElementById('sheetImg').src=src;m.textContent='';{const g=document.getElementById('sheetGrade');if(g)g.textContent=UI.cardGrade||''}
  const full=`${txt}\n\n나도 정치인 키워 보기 → ${GAME_URL}`,E=encodeURIComponent;
  const copyText=(after)=>{const ok=()=>m.textContent=after;const fb=()=>{const ta=document.getElementById('cpyTxt');ta.value=full;ta.hidden=false;sh.hidden=true;ta.select();document.getElementById('cpyMsg').textContent='복사가 막혀 있어요. 아래 문구를 선택해 복사하세요.'};
    try{navigator.clipboard.writeText(full).then(ok,fb)}catch(e){fb()}};
  const view=()=>{const v=document.getElementById('viewer');document.getElementById('viewImg').src=src;v.hidden=false};
  const A=[];
  if(navigator.share&&(!UI.dl||window.__WEB))A.push({k:'device',n:'기기 공유',c:'#3a3f48',g:'⇪',f:()=>{const b=UI.cardBlob;let d={title:'정치인키우기',text:full};try{const f=new File([b],'politician-card.png',{type:'image/png'});if(b&&navigator.canShare&&navigator.canShare({files:[f]}))d.files=[f]}catch(e){}
    navigator.share(d).then(()=>m.textContent='공유했어요.',()=>m.textContent='이 화면에서는 기기 공유가 막혀 있어요. 아래 앱을 골라 주세요.')}});
  const saveImg=async(after)=>{const b=UI.cardBlob;if(!b){m.textContent='이미지를 만드는 중이에요. 잠시 뒤 다시 눌러 주세요.';return}
    let d=null;try{d=UI.dl||(window.claude&&window.claude.use?await window.claude.use('downloads'):null)}catch(e){}
    if(!d){view();m.textContent='이 화면에서는 저장 창을 열 수 없어요. 크게 띄운 이미지를 길게 눌러 저장하세요.';return}
    try{await d.save({filename:`정치인키우기-${UI.cardName||(S&&S.name)||'결과'}.png`,data:b});m.textContent=after||'저장했어요. 휴대폰에서는 공유 창이나 갤러리에서 원하는 앱으로 보내세요.'}
    catch(e){const c=e&&e.code;m.textContent=c==='declined'?'저장을 취소했어요.':c==='rate_limited'?'이미 저장 창이 열려 있어요. 잠시 뒤 다시 눌러 주세요.':'이 화면에서는 저장이 막혀 있어요. 크게 띄운 이미지를 길게 눌러 저장하세요.';if(c!=='declined'&&c!=='rate_limited')view()}};
  A.push({n:'이미지 저장',c:'#2f6be0',g:'↓',f:()=>saveImg()});
  A.push({n:'카카오톡',c:'#FEE500',fc:'#3a1d1d',g:'톡',f:()=>{copyText('문구를 복사했어요.');saveImg('이미지를 저장했어요. 카카오톡에서 사진으로 보내고 복사한 문구를 붙여넣으세요.')}});
  A.push({n:'인스타그램',c:'#d6297b',g:'IG',f:()=>{copyText('문구를 복사했어요.');saveImg('이미지를 저장했어요. 인스타그램 스토리나 게시물에 올리세요.')}});
  A.push({n:'X',c:'#111111',g:'X',href:`https://twitter.com/intent/tweet?text=${E(txt)}&url=${E(GAME_URL)}`});
  A.push({n:'스레드',c:'#222222',g:'@',href:`https://www.threads.net/intent/post?text=${E(full)}`});
  A.push({n:'페이스북',c:'#1877F2',g:'f',href:`https://www.facebook.com/sharer/sharer.php?u=${E(GAME_URL)}`});
  A.push({n:'밴드',c:'#06C755',g:'B',href:`https://band.us/plugin/share?body=${E(full)}&route=${E(GAME_URL)}`});
  A.push({n:'라인',c:'#00B900',g:'L',href:`https://social-plugins.line.me/lineit/share?url=${E(GAME_URL)}&text=${E(txt)}`});
  A.push({n:'크게 보기',c:'#55606e',g:'⤢',f:view});
  A.push({n:'문구 복사',c:'#9aa3ad',g:'🔗',f:()=>copyText('공유 문구와 게임 링크를 복사했어요.')});
  apps.innerHTML=A.map((a,i)=>{const ic=`<span class="ic" style="background:${a.c};color:${a.fc||'#fff'}">${esc(a.g)}</span><span class="nm">${a.n}</span>`;
    return a.href?`<a class="app" href="${a.href}" target="_blank" rel="noopener">${ic}</a>`:`<button class="app" data-a="${i}">${ic}</button>`}).join('');
  apps.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>A[+b.dataset.a].f());
  apps.querySelectorAll('a.app').forEach(a=>a.addEventListener('click',()=>{m.textContent='새 창에서 공유 화면이 열려요.'}));
  sh.hidden=false;
  const close=()=>sh.hidden=true;document.getElementById('shx').onclick=close;sh.onclick=e=>{if(e.target===sh)close()};
  document.getElementById('vx').onclick=()=>document.getElementById('viewer').hidden=true;
}

/* ============ 경력별 칭호 ============ */
function careerTitle(){const H=S.held||{},P=S.end==='pres'||S.best==='pres'||(H.pres||0)>0,mn=(H.min||[]).length,best=offName(S.best||'none'),w=S.stats.wins,l=S.stats.losses,tr=S.stats.trials||0,ig=s().integrity;
  const R0=[
   [P&&mn&&H.pm,'내각을 거쳐 정상에 오른 사람','장관과 총리를 모두 지낸 뒤 대통령이 됐다. 정부 조직도를 외우고 취임했다.'],
   [P&&H.pm,'총리 출신 대통령','"일인지하"에서 한 계단을 더 올랐다.'],
   [P&&mn,'장관 출신 대통령','국무회의 말석에서 시작해 의장석에 앉았다.'],
   [P&&S.everTogul,'흙집에서 대통령까지','산골 흙집의 아궁이 불씨가 대통령 선거까지 이어졌다.'],
   [P&&S.everWhip,'야당 원내대표 출신 대통령','협상 테이블 맞은편에서 정권을 가져왔다.'],
   [P&&S.party==='ind','무소속 대통령','당 없이 이겼다. 국회에는 내 편이 없었다.'],
   [P&&S.npFounded,'신당 창업주 대통령','직접 만든 당으로 정권을 잡았다.'],
   [P&&l>=3,'칠전팔기 대통령',`${l}번 졌지만 마지막에 이겼다.`],
   [!P&&H.pm&&(H.pm>1||(S.pmExt||0)>0),'만년 총리','대통령 바로 아래 자리에서 오래 버텼다. 그 위로는 끝내 못 갔다.'],
   [!P&&H.pm,'대권 문턱의 총리','총리까지 올랐지만 대권의 문은 열리지 않았다.'],
   [mn>=2,'장관 전문가',`${(H.min||[]).join('·')} 장관을 두루 지냈다.`],
   [mn&&(H.gov||0)>0,'도지사 출신 장관','지방에서 쌓은 행정 경험을 중앙으로 들고 갔다.'],
   [mn,`${(H.min||[])[0]} 장관 출신`,'국무위원 명패를 한 번은 받아 봤다.'],
   [S.everTogul&&w>0&&S.everTogulWin,`흙집에서 돌아온 ${best}`,'산에서 내려와 다시 이겼다.'],
   [S.everTogul,'흙집의 은자','칩거는 길었고, 하산은 늦었다.'],
   [S.everWhip,'야당 원내 사령탑','소수의 힘으로 다수와 싸웠다.'],
   [S.npFounded,'신당 창업주','양당 바깥에 깃발을 꽂았다.'],
   [w>=5&&l>=5,'오뚝이',`${w}승 ${l}패. 넘어질 때마다 다시 섰다.`],
   [l>=4&&w<=1,'만년 낙선자','출마는 꾸준했다. 당선만 빼고.'],
   [tr>=2,'법정 단골',`재판만 ${tr}번. 변호사가 가족 같았다.`],
   [w>=8,'선거의 귀재',`${w}번 이겼다. 선거 운이 아니라 실력이었다.`],
   [ig>=90,'청백리','끝까지 깨끗했다. 기록이 증명한다.'],
   [(H.basic||0)>=3,'동네 터줏대감','동네 골목은 다 알았다. 골목도 나를 알았다.'],
   [S.party==='ind'&&w>=3,'무소속 생존자','당 없이도 살아남았다.']];
  const m=R0.find(r=>r[0]);return m?{t:m[1],d:m[2]}:null}
function renderEnding(){
  const e=ENDS[S.end],held=heldTxt(S.held);
  $app.innerHTML=`<section class="poster ending">
    ${pxTag(ENDS[S.end].t)}
    <div class="label">${S.startYear}–${S.year} · ${S.year-S.startYear+1}년의 정치 인생</div>
    <h2 style="margin-top:6px">${esc(S.grade||e.t)}</h2>
    ${(()=>{const ct=careerTitle();return ct?`<div class="ctitle"><b>「${esc(ct.t)}」</b><span>${esc(ct.d)}</span></div>`:''})()}
    ${(S.newAch&&S.newAch.length)?`<div class="newach"><b>🏅 새 업적 ${S.newAch.length}개</b>${S.newAch.map(id=>`<span>${esc(ACHM[id][1])}</span>`).join("")}<button class="linkbtn" id="dexe">도감 보기</button></div>`:""}
    <p class="sub">${e.b}</p>
    <dl style="margin-top:16px">
      <dt>이름</dt><dd>${esc(S.name)} (${S.age}세)</dd><dt>지역</dt><dd>${esc(distName())}</dd>
      <dt>최종 소속</dt><dd>${PARTIES[S.party].n}</dd>
      <dt>최고 직위</dt><dd>${esc(S.bestName||offName(S.best))}</dd>${S.presEv?`<dt>퇴임 평가</dt><dd>${S.presEv.sc}점 · 역대 ${S.presEv.of}명 중 <b>${S.presEv.rank}위</b> · 재임 평균 지지율 ${S.presEv.ap}% · 국정과제 ${S.presEv.fin?'완수':'미완'}</dd>`:''}
      <dt>거친 자리</dt><dd>${held||'—'}</dd>
      <dt>선거 전적</dt><dd class="num">${S.stats.wins}승 ${S.stats.losses}패</dd>
      <dt>재판</dt><dd>${S.stats.trials?S.stats.trials+'건':'없음'}</dd>${S.rival?`<dt>라이벌</dt><dd>${esc(S.rival.name)} 상대 ${S.rival.l}승 ${S.rival.w}패</dd>`:''}
      <dt>남은 자금</dt><dd class="num">${won(s().money)}</dd>
    </dl>
    <div class="row" style="margin-top:18px"><button class="btn party" id="again">새 정치인 키우기</button></div>
  </section>
  ${rvChron().length?`<section class="card rvchron"><h3 style="font-size:20px">라이벌 연대기</h3>${rvChron().map(v=>`<div class="rvc"><div class="rvh"><b>${esc(v.name)}</b> <span class="muted">${PARTIES[v.party]?PARTIES[v.party].s:''} · 나와의 전적 ${v.l}승 ${v.w}패</span></div>
    <p>${rvFate(v,v.cur)}</p>${(v.path||[]).length?`<ol class="rvp">${v.path.slice(-6).map(([y,s])=>`<li><span class="num">${y}</span>${esc(s)}</li>`).join('')}</ol>`:''}</div>`).join('')}</section>`:''}
  <section class="card share"><h3 style="font-size:20px">결과 카드</h3>
    <p class="muted" style="margin:4px 0 12px;font-size:13px">공유하기를 누르면 보낼 곳을 고를 수 있어요.</p>
    <img id="shareImg" alt="정치 인생 결과 카드">
    <div class="row" style="margin-top:12px"><button class="btn party" id="cpy">공유하기</button><span id="cpyMsg" class="muted" style="font-size:13px"></span></div>
    <textarea id="cpyTxt" readonly hidden></textarea>
  </section>${logHTML()}
  ${sheetHTML()}`;
  document.getElementById('again').onclick=()=>{const pk=UI.cfg&&UI.cfg.perks;S=null;UI.cfg=null;render()};
  {const de=document.getElementById('dexe');if(de)de.onclick=openDex}
  paint(ENDPX[S.end]||'street|me|');
  const txt=shareText();const cb=document.getElementById('cpy'),msg=document.getElementById('cpyMsg'),ta=document.getElementById('cpyTxt');ta.value=txt;
  cb.onclick=()=>openSheet(txt);
  makeCard();
}

/* ============ 시작 ============ */
function initDl(){try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{UI.dl=d},()=>{})}catch(e){}}
function fixup(){npDefine();if(S&&S.v===4&&!S.rival&&S.phase!=='ending'){S.rival=mkRival()}}
function boot(data){
  if(data&&data.S&&data.S.v===4)S=data.S;else{const sv=store.get('pol-save');S=null;UI.resume=sv}
  render();setTimeout(initDl,0);
}
window.__polRefresh=(force)=>{if(force||!S||S.phase==='start'){S=null;UI.resume=store.get('pol-save');render()}};window.__polBusy=()=>!!(S&&S.phase!=='start'&&S.phase!=='ending');
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
